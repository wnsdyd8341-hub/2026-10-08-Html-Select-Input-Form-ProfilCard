<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            padding: 0px;
            margin: 0px;
            box-sizing: border-box;
        }
        body{
            background-color: #f5f5f5;
            font-family: Arial, Helvetica, sans-serif;
        }
        .admin{
            width: 1000px;
            border: 1px solid #333;
            margin: 20px auto;
            padding: 3px 10px;
            text-align: center;
        }
        table{
            width: 100%;
            margin: 0px auto;
            /* 테두리가 겹치는 것을 하나로 합침 */
            border-collapse: collapse;
        }
        th,td{
            padding: 0px 10px;
            border: 1px solid #ddd;
        }
        th{
            background-color: #333;
            color: #fff;
        }
        tbody tr:hover{
            cursor: pointer;
            background-color: #555;
        }
        .complete{
            color: green;
            font-weight: bold;
        }
        .delivery{
            color: orange;
            font-weight: bold
        }
        .ready{
            color:blue ;
            font-weight: bold;
        }

    </style>
</head>
<body>
    <div class="admin">
        <h2>주문관리</h2>
        <table>
            <thead>
                <tr>
                    <th>주문번호</th>
                    <th>고객명</th>
                    <th>상품명</th>
                    <th>수량</th>
                    <th>금액</th>
                    <th>주문상태</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>1001</td>
                    <td>김민지</td>
                    <td>무선 키보드</td>
                    <td>1</td>
                    <td>59,000원</td>
                    <td class="complete">배송완료</td>
                </tr>
                <tr>
                    <td>1002</td>
                    <td>홍길동</td>
                    <td>무선 마우스</td>
                    <td>2</td>
                    <td>48,000원</td>
                    <td class="delivery">배송중</td>
                </tr>
                <tr>
                    <td>1003</td>
                    <td>이수진</td>
                    <td>노트북 받침대</td>
                    <td>1</td>
                    <td>35,000원</td>
                    <td class="ready">상품 준비중</td>
                </tr>
                
            </tbody>
        </table>
    </div>
</body>
</html>
