<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form 태그</title>
    <style>
        


    </style>
</head>
<body>
    <form>
        <label for="Id">아이디 : </label>
        <!-- placeholder : input text칸 안에 글자 보여줌-->
        <input type="text" name="ID" id="" placeholder="아이디 입력"><br>
        <label for="password">비밀번호 : </label>
        <input type="password" name="age" id="" placeholder="비밀번호" required><br>
        <button type="submit">제출</button>
        <button type="reset">초기화</button><br>
        <input type="email" name="" id=""placeholder="이메일"><br>
        <input type="tel" name="" id="" placeholder="전화번호"><br>
        <input type="number" placeholder="0~20" max="20" min="0"><br>
        <input type="url" placeholder="주소 입력"><br>
        <input type="search" placeholder="검색"><br>
        <input type="checkbox" > 
        <input type="checkbox" > 
        <input type="checkbox" > <br>
        <!-- 복수선택을 안할려면 name을 같은 이름으로 설정해야한다 -->
        <input type="radio" name="gender">
        <input type="radio"name="gender">
        <input type="radio" name="gender"> <br>

        <!-- 파일선택 타입 -->
        <input type="file" > <br>

        <input type="button" value="로그인">
        <!-- 이미지모양 버튼 -->
        <input type="image" src="image/KakaoTalk_20261007_093318802.jpg" >
        <!-- 화면에 안 보이지만 몰래 값을 저장하는 칸 -->
        <input type="hidden" name="">

        <input type="date" name="" id="">

        <input type="datetime-local" name="" id="">
        <input type="month" name="" id="">
        <input type="week" name="" id="">
        <input type="time" name="" id="">
        <input type="range" name="" id="">
        <input type="color" name="" id="">
        <textarea name="" id=""></textarea>
    </form>    
</body>
</html>
